name: Release Builds

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'ReadNext v1.0.0 - Production Release'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        type: string
        default: |
          ### ReadNext - Smart PDF Reader & Annotation Suite

          #### Highlights
          - **Smart PDF Reader & Viewer**: Smooth scrolling, page jump, fit-width/height, zoom controls.
          - **All-in-One PDF Tool Hub**: Convert, merge, split, compress, watermark, protect, unlock, and manage pages.
          - **Offline Neural OCR**: Extract text and generate searchable PDFs locally.
          - **Cross-Platform Availability**: Windows, Linux, macOS, Android, and iOS.

          #### Downloads
          - **Windows**: `ReadNext-Setup-v1.0.0.exe` (Next -> Next -> Finish installer wizard) or portable `.zip`
          - **Linux**: `ReadNext-v1.0.0-Linux-x64.deb` or portable `.tar.gz`
          - **macOS**: `ReadNext-macOS.dmg` or portable `.zip`
          - **Android**: `ReadNext-Android.apk`
          - **iOS**: `ReadNext-iOS-unsigned.ipa`
      run_id:
        description: 'Workflow Run ID to Release (leave blank to release latest successful build on main)'
        required: false
        type: string
        default: ''
      is_draft:
        description: 'Save as Draft Release (Review in GitHub before publishing)'
        required: true
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release / Beta'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release Builds to GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Build Run ID
        id: resolve-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$CUSTOM_RUN_ID" ]; then
            echo "Using user-specified Run ID: $CUSTOM_RUN_ID"
            echo "run_id=$CUSTOM_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Searching for latest successful build on main..."
            LATEST_RUN_ID=$(gh run list --workflow="build.yml" --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$LATEST_RUN_ID" ] || [ "$LATEST_RUN_ID" = "null" ]; then
              echo "Error: No successful build found on main branch."
              exit 1
            fi
            echo "Found latest successful build Run ID: $LATEST_RUN_ID"
            echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Build Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: ${{ steps.resolve-run.outputs.run_id }}
        run: |
          mkdir -p raw_artifacts release_assets
          echo "Downloading artifacts from run $TARGET_RUN_ID..."
          gh run download "$TARGET_RUN_ID" --dir raw_artifacts

          echo "Organizing build packages into release_assets directory..."
          find raw_artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.zip" -o \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.dmg" -o \
            -name "*.apk" -o \
            -name "*.ipa" \
          \) -exec cp -v {} release_assets/ \;

      - name: Generate Checksums (SHA-256)
        run: |
          cd release_assets
          echo "Generating SHA256SUMS.txt for release assets..."
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Display Release Files
        run: |
          echo "=== Files to be attached to GitHub Release ==="
          ls -lh release_assets/

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.release_title || inputs.version_tag }}
          body: ${{ inputs.release_notes }}
          draft: ${{ inputs.is_draft }}
          prerelease: ${{ inputs.is_prerelease }}
          files: release_assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
